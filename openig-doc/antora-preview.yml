site:
  title: OpenIG Documentation Preview
  start_page: openig::index.adoc
content:
  sources:
    - url: ..
      branches: HEAD
      worktrees: .
      start_path: openig-doc/target/asciidoc/antora
    - url: ./target/doc-site
      branches: HEAD
      start_path: openam
ui:
  bundle:
    url: ./target/doc-site/ui/ui-bundle.zip
asciidoc:
  extensions:
    - ./target/doc-site/lib/nested-open-block.js
urls:
  html_extension_style: drop
output:
  dir: ./target/rendered-docs
  clean: true
