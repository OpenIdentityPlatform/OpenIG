apiVersion: v1
kind: Service
metadata:
  name: openig
spec:
  selector:
    app: openig
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openig
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openig
  template:
    metadata:
      labels:
        app: openig
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: openig
          image: openidentityplatform/openig:latest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: config
              mountPath: /var/openig/config
              readOnly: true
            - name: routes
              mountPath: /var/openig/config/routes
              readOnly: true
            - name: scripts
              mountPath: /var/openig/scripts/groovy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: openig-config
        - name: routes
          configMap:
            name: openig-routes
        - name: scripts
          configMap:
            name: openig-scripts
            optional: true
