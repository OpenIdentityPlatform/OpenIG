services:
  openam:
    image: openidentityplatform/openam:latest
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - openam-data:/usr/openam/config
    networks:
      default:
        aliases:
          - openam.example.org
  openig:
    image: openidentityplatform/openig:latest
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/openig/api/info"]
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./openig-config:/var/openig/config:ro
    environment:
      CATALINA_OPTS: >-
        -Dopenam=http://openam.example.org:8080/openam
        -Dws.secured=ws://echo-server:8080
        -Dorg.openidentityplatform.openig.websocket.ttl=180
  echo-server:
    image: jmalloc/echo-server:latest
volumes:
  openam-data:
