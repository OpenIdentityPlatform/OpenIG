services:
  openig:
    image: openidentityplatform/openig:latest
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/openig/api/info"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./openig/config:/var/openig/config:ro
      - ./openig/scripts:/var/openig/scripts:ro
    environment:
      CATALINA_OPTS: -Dopenai.api=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  ollama-models:
